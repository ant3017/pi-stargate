# WireGuard tunnel — interface name is wh0 (wg-quick@wh0).
# AllowedIPs = 0.0.0.0/0 means ALL routed traffic (the Pi's own AND
# forwarded ap0-client traffic) exits via the tunnel, whichever uplink
# (wlan0 or eth0) carries the encrypted UDP underneath.
# Fill in: PrivateKey (this Pi), PublicKey + Endpoint (server).

[Interface]
PrivateKey = <PI-PRIVATE-KEY>
Address = 192.168.255.3/24
# If the Pi's own DNS should also go through the tunnel:
# DNS = 1.1.1.1

[Peer]
PublicKey = <SERVER-PUBLIC-KEY>
Endpoint = <SERVER-IP-OR-HOST>:51820
AllowedIPs = 0.0.0.0/0
PersistentKeepalive = 25
