## stargate

[Interface]
PrivateKey = WD+M6PekJNKWdooD9btL0mxEIV8/CADSO+R7heZEqmU=
Address = 192.168.255.3/24

PostUp = iptables -t nat -A POSTROUTING -o %i -j MASQUERADE; iptables -A FORWARD -i ap0 -o %i -j ACCEPT; iptables -A FORWARD -i %i -o ap0 -m state --state RELATED,ESTABLISHED -j ACCEPT
PreDown = iptables -t nat -D POSTROUTING -o %i -j MASQUERADE; iptables -D FORWARD -i ap0 -o %i -j ACCEPT; iptables -D FORWARD -i %i -o ap0 -m state --state RELATED,ESTABLISHED -j ACCEPT

# Keep the AP client's own WireGuard tunnel outside this Pi's tunnel.
PostUp = iptables -w -t mangle -C PREROUTING -i ap0 -p udp --dport 55001 -j MARK --set-mark 0xca6c 2>/dev/null || iptables -w -t mangle -A PREROUTING -i ap0 -p udp --dport 55001 -j MARK --set-mark 0xca6c
PostUp = iptables -w -C FORWARD -i ap0 -o eth0 -p udp --dport 55001 -m mark --mark 0xca6c -j ACCEPT 2>/dev/null || iptables -w -A FORWARD -i ap0 -o eth0 -p udp --dport 55001 -m mark --mark 0xca6c -j ACCEPT
PostUp = iptables -w -C FORWARD -i ap0 -o wlan0 -p udp --dport 55001 -m mark --mark 0xca6c -j ACCEPT 2>/dev/null || iptables -w -A FORWARD -i ap0 -o wlan0 -p udp --dport 55001 -m mark --mark 0xca6c -j ACCEPT
PostUp = iptables -w -t nat -C POSTROUTING -o eth0 -m mark --mark 0xca6c -j MASQUERADE 2>/dev/null || iptables -w -t nat -A POSTROUTING -o eth0 -m mark --mark 0xca6c -j MASQUERADE
PostUp = iptables -w -t nat -C POSTROUTING -o wlan0 -m mark --mark 0xca6c -j MASQUERADE 2>/dev/null || iptables -w -t nat -A POSTROUTING -o wlan0 -m mark --mark 0xca6c -j MASQUERADE
PostUp = iptables -w -C FORWARD -i eth0 -o ap0 -p udp --sport 55001 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || iptables -w -A FORWARD -i eth0 -o ap0 -p udp --sport 55001 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
PostUp = iptables -w -C FORWARD -i wlan0 -o ap0 -p udp --sport 55001 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || iptables -w -A FORWARD -i wlan0 -o ap0 -p udp --sport 55001 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT
PreDown = iptables -w -D FORWARD -i wlan0 -o ap0 -p udp --sport 55001 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || true
PreDown = iptables -w -D FORWARD -i eth0 -o ap0 -p udp --sport 55001 -m conntrack --ctstate RELATED,ESTABLISHED -j ACCEPT 2>/dev/null || true
PreDown = iptables -w -t nat -D POSTROUTING -o wlan0 -m mark --mark 0xca6c -j MASQUERADE 2>/dev/null || true
PreDown = iptables -w -t nat -D POSTROUTING -o eth0 -m mark --mark 0xca6c -j MASQUERADE 2>/dev/null || true
PreDown = iptables -w -D FORWARD -i ap0 -o wlan0 -p udp --dport 55001 -m mark --mark 0xca6c -j ACCEPT 2>/dev/null || true
PreDown = iptables -w -D FORWARD -i ap0 -o eth0 -p udp --dport 55001 -m mark --mark 0xca6c -j ACCEPT 2>/dev/null || true
PreDown = iptables -w -t mangle -D PREROUTING -i ap0 -p udp --dport 55001 -j MARK --set-mark 0xca6c 2>/dev/null || true

