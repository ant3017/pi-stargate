# DHCP + DNS for AP clients only (ap0). DNS is REQUIRED — the portal's
# captive-detection hijack drops a catch-all file into this directory.
# no-resolv + explicit server= : do NOT read /etc/resolv.conf (it may
# point at 127.0.0.1 = this dnsmasq -> loop). Upstreams are fixed.
interface=ap0
bind-interfaces
no-resolv
server=1.1.1.1
server=8.8.8.8
domain-needed
bogus-priv
dhcp-range=192.168.50.10,192.168.50.100,255.255.255.0,24h
dhcp-option=3,192.168.50.1
dhcp-option=6,192.168.50.1
